# Schduled, the normal way to run it. PostgreSQL included, nothing built
# locally.
#
#   curl -O https://raw.githubusercontent.com/stack256org/scheduled/main/docker-compose.yml
#   curl -o .env https://raw.githubusercontent.com/stack256org/scheduled/main/.env.docker.example
#   # edit .env: set APP_SECRET (openssl rand -base64 36) and NEXT_PUBLIC_APP_URL
#   docker compose up -d
#
# This pulls published images built for both Intel and ARM, rather than
# running a full Next.js build on your server, which on a small machine is
# slow and memory-hungry.
#
# NOT RELEASED YET: this repo hasn't cut its first tagged version (see
# .github/workflows/release.yml and CHANGELOG.md) — `latest` will not exist
# until that happens. Until then, run with:
#   IMAGE_TAG=main docker compose up -d
# which pulls whatever last passed CI on main. Once a version is tagged,
# `latest` and the version ladder (X, X.Y, X.Y.Z) become available and
# `latest` is the default below.
#
# The other two files are alternatives, never used alongside this one:
#   docker-compose.external-db.yml   your own PostgreSQL instead of the bundled one
#   docker-compose.build.yml         build from source, for changing the code
#
# Pin a version in production, because `latest` (and `main`) both move on
# every release/push:
#   IMAGE_TAG=1.0.0 docker compose up -d
#
# Port 3000 already taken? Use HOST_PORT, never PORT. See the web service
# below.
#
# Your data lives in two named volumes, schduled_postgres_data and
# schduled_uploads. They are pinned to literal names and survive `down`,
# `pull`, and `up -d`. Only `down -v` destroys them.

x-web-image: &web_image ${SCHDULED_WEB_IMAGE:-ghcr.io/stack256org/schduled}:${IMAGE_TAG:-latest}
x-worker-image: &worker_image ${SCHDULED_WORKER_IMAGE:-ghcr.io/stack256org/schduled-worker}:${IMAGE_TAG:-latest}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schduled}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-schduled}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schduled}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Runs as root for a fraction of a second, purely to hand the uploads
  # volume to the non-root `app` user (uid 1001) the web image runs as.
  # Docker gives a *pre-existing* named volume root ownership, so a
  # deployment created before the image went non-root would otherwise start
  # failing uploads with EACCES. A fresh volume already has the right
  # ownership from the image, making this a no-op — either way it runs
  # unconditionally so no operator has to remember a manual migration step.
  #
  # `alpine` rather than the app image so it needs nothing pulled beyond
  # itself and cannot be affected by app-level env or entrypoint changes.
  init-uploads:
    image: alpine:3
    user: "0:0"
    command: >
      sh -c "chown -R 1001:1001 /app/uploads &&
             echo 'uploads volume ownership set to uid/gid 1001'"
    volumes:
      - uploads:/app/uploads
    restart: "no"

  migrate:
    image: *worker_image
    pull_policy: always
    # Not `pnpm db:migrate` (drizzle-kit's CLI) — it was observed to exit 1
    # on failure without printing the underlying error. `db:migrate:docker`
    # (scripts/migrate.ts) uses the same postgres/drizzle-orm migrator
    # lib/db.ts already depends on, with a plain try/catch that always logs
    # what it caught.
    command: ["pnpm", "db:migrate:docker"]
    env_file: .env
    depends_on:
      init-uploads:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    image: *web_image
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    # HOST_PORT, not PORT: `env_file: .env` passes every var into the
    # container, and the app itself listens on PORT internally — so naming
    # this PORT would make one variable silently change the container's
    # internal bind port too, breaking both this mapping and the
    # HEALTHCHECK below (which probes :3000).
    environment:
      PORT: 3000
    ports:
      - "${HOST_PORT:-3000}:3000"
    depends_on:
      init-uploads:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # Only used when STORAGE_DRIVER=local (the default). Not needed if
      # you've set STORAGE_DRIVER=s3/r2 — see ENVIRONMENT.md §7.
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    image: *worker_image
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  # Pinned to literal names (not just "postgres-data"/"uploads") on purpose:
  # Compose namespaces unnamed volumes as "<compose-project-name>_<volume-name>",
  # and some deploy tools (observed with Dokploy) don't keep the project name
  # stable across redeploys — that silently creates a NEW, empty volume each
  # time, orphaning the old one (DB data or uploads) without any error.
  # Pinning guarantees every deploy reattaches to the same volume, and it's
  # the same name used by docker-compose.build.yml, so you can switch between
  # the two without losing data.
  postgres-data:
    name: schduled_postgres_data
  uploads:
    name: schduled_uploads
